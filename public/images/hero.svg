  </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#g-hero)"/>
  <g opacity="0.28" stroke="#a08b74" stroke-width="1" fill="none">
    <circle cx="800" cy="420" r="260"/>
    <circle cx="800" cy="420" r="380"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain-hero)" opacity="0.11"
        style="mix-blend-mode:overlay"/>
  <text x="50%" y="974" text-anchor="middle"
        font-family="Times New Roman, Times, serif" font-size="88"
        letter-spacing="3" fill="#3a332c" opacity="0.65"></text>
