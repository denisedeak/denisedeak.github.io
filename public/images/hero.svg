<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="">
  <defs>
    <linearGradient id="g-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9dfd4"/>
      <stop offset="100%" stop-color="#a08b74"/>
    </linearGradient>
    
  <filter id="grain-hero" x="0" y="0" width="100%" height="100%">
